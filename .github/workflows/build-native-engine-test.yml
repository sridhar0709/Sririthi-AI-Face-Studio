name: Build native face-swap engine test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-engine-test:
    name: Build Android ONNX face-swap proof of concept
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sririthi AI Face Studio
        uses: actions/checkout@v4

      - name: Check out the MIT-licensed Android engine reference
        uses: actions/checkout@v4
        with:
          repository: Parasaran-Python/android-face-fusion
          ref: master
          path: engine-source

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: engine-source
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sririthi-native-engine-test-apk
          path: engine-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
