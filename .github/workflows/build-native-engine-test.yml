name: Build Sririthi native face-swap APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sririthi:
    name: Build branded native photo engine
    runs-on: ubuntu-latest
    steps:
      - name: Check out Sririthi AI Face Studio
        uses: actions/checkout@v4

      - name: Check out Android ONNX engine reference
        uses: actions/checkout@v4
        with:
          repository: Parasaran-Python/android-face-fusion
          ref: master
          path: engine-source

      - name: Brand package and app label
        working-directory: engine-source
        run: |
          sed -i 's/applicationId = "com.pv.androidfacefusion"/applicationId = "com.sririthi.aiface"/' app/build.gradle.kts
          sed -i 's/<string name="app_name">AndroidFaceFusion<\//<string name="app_name">Sririthi AI Face<\//' app/src/main/res/values/strings.xml
          echo "Configured applicationId:"
          grep 'applicationId =' app/build.gradle.kts
          echo "Configured app label:"
          cat app/src/main/res/values/strings.xml

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: engine-source
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish branded test APK
        uses: actions/upload-artifact@v4
        with:
          name: Sririthi-AI-Face-photo-engine-test
          path: engine-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
